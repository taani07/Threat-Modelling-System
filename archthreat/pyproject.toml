[project]
name = "archthreat"
version = "0.1.0"
description = "Threat modeling as code: STRIDE rules plus RAG-grounded LLM enrichment, Mermaid DFDs, SARIF export and PR diffs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tanishka Chaturvedi" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "fastmcp>=2.10",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
archthreat = "archthreat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archthreat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"labs/*" = ["S"]
